<div id="leap-share" class="leap-share" hidden>
  <span class="leap-share-label">Share</span>
  <a id="ls-x" target="_blank" rel="noopener">X</a>
  <a id="ls-li" target="_blank" rel="noopener">LinkedIn</a>
  <a id="ls-em">Email</a>
  <a id="ls-cp" href="#">Copy link</a>
</div>
<div id="leap-quote-pop" class="leap-quote-pop" hidden>
  <a id="lq-cp" href="#">Copy</a>
  <a id="lq-x" target="_blank" rel="noopener">X</a>
  <a id="lq-li" target="_blank" rel="noopener">LinkedIn</a>
  <a id="lq-native" href="#" hidden>Share&hellip;</a>
</div>
<script>
(function () {
  var url = location.href.split("#")[0];
  var title = document.title;
  var bar = document.getElementById("leap-share");
  var tb = document.getElementById("title-block-header");
  if (tb && bar) { tb.appendChild(bar); bar.hidden = false; }

  document.getElementById("ls-x").href =
    "https://x.com/intent/post?text=" + encodeURIComponent(title) + "&url=" + encodeURIComponent(url);
  document.getElementById("ls-li").href =
    "https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(url);
  document.getElementById("ls-em").href =
    "mailto:?subject=" + encodeURIComponent(title) + "&body=" + encodeURIComponent(url);
  document.getElementById("ls-cp").addEventListener("click", function (e) {
    e.preventDefault();
    var el = e.target;
    navigator.clipboard.writeText(url).then(function () {
      el.textContent = "Copied!";
      setTimeout(function () { el.textContent = "Copy link"; }, 1500);
    });
  });

  // ----- Select any passage -> quote widget -----
  var pop = document.getElementById("leap-quote-pop");
  var main = document.getElementById("quarto-document-content");
  if (!main) return;
  var nativeBtn = document.getElementById("lq-native");
  if (navigator.share) nativeBtn.hidden = false;

  var currentQuote = "";

  function positionAndShow(rect) {
    pop.hidden = false;
    var top = window.scrollY + rect.top - pop.offsetHeight - 10;
    if (top < window.scrollY + 8) top = window.scrollY + rect.bottom + 10;
    pop.style.top = top + "px";
    pop.style.left = Math.max(
      8,
      Math.min(
        window.scrollX + rect.left + rect.width / 2 - pop.offsetWidth / 2,
        window.scrollX + window.innerWidth - pop.offsetWidth - 8
      )
    ) + "px";
  }

  function refresh() {
    var sel = window.getSelection();
    var text = sel ? sel.toString().trim() : "";
    if (text.length > 3 && text.length < 700 && sel.anchorNode && main.contains(sel.anchorNode)) {
      currentQuote = "“" + text + "”";
      var blurb = currentQuote + " — " + title;
      document.getElementById("lq-x").href =
        "https://x.com/intent/post?text=" + encodeURIComponent(blurb) + "&url=" + encodeURIComponent(url);
      // LinkedIn's prefill only reliably accepts the URL; the quote is
      // copied to the clipboard on click so it can be pasted into the post.
      document.getElementById("lq-li").href =
        "https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent(url);
      positionAndShow(sel.getRangeAt(0).getBoundingClientRect());
    } else {
      pop.hidden = true;
    }
  }

  document.addEventListener("mouseup", function () { setTimeout(refresh, 10); });
  document.addEventListener("touchend", function () { setTimeout(refresh, 150); });
  document.addEventListener("selectionchange", function () {
    if (window.getSelection().toString().trim() === "") pop.hidden = true;
  });
  document.addEventListener("scroll", function () { pop.hidden = true; }, {passive: true});

  document.getElementById("lq-cp").addEventListener("click", function (e) {
    e.preventDefault();
    var el = e.target;
    navigator.clipboard.writeText(currentQuote + " — " + title + " " + url).then(function () {
      el.textContent = "Copied!";
      setTimeout(function () { el.textContent = "Copy"; pop.hidden = true; }, 900);
    });
  });
  document.getElementById("lq-li").addEventListener("click", function () {
    // stash the quote for pasting into LinkedIn's composer
    navigator.clipboard.writeText(currentQuote + " — " + title + " " + url);
  });
  nativeBtn.addEventListener("click", function (e) {
    e.preventDefault();
    navigator.share({title: title, text: currentQuote, url: url}).catch(function () {});
    pop.hidden = true;
  });
})();
</script>
