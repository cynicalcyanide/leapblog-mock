<!-- Site-wide subscribe widget (fixed, right side, desktop only).
     COLLECTION ENDPOINT: set window.LEAP_SUBSCRIBE_ENDPOINT below to a
     form backend (Google Form formResponse URL, Formspree, or listmonk's
     /subscription endpoint when it exists). Empty = demo mode. -->
<script>
  window.LEAP_SUBSCRIBE_ENDPOINT = window.LEAP_SUBSCRIBE_ENDPOINT || "";
  window.leapSubscribe = function (form) {
    var email = form.querySelector('input[type="email"]').value;
    var done = function (msg) {
      form.innerHTML = '<div class="leap-subscribe-done">' + msg + "</div>";
    };
    var ep = window.LEAP_SUBSCRIBE_ENDPOINT;
    if (!ep) {
      done("Thanks! (Demo mode — the newsletter backend isn't connected yet, so this address wasn't stored.)");
      return false;
    }
    var data = new FormData();
    data.append("email", email);
    fetch(ep, {method: "POST", mode: "no-cors", body: data})
      .then(function () { done("Thanks — you're on the list!"); })
      .catch(function () { done("Something went wrong; please try again later."); });
    return false;
  };
</script>
<div id="leap-side-subscribe" class="leap-side-subscribe">
  <button id="leap-side-close" class="leap-side-close" aria-label="Close">&times;</button>
  <div class="leap-kicker">Newsletter</div>
  <p>New articles, straight to your inbox.</p>
  <form onsubmit="return leapSubscribe(this);">
    <input type="email" placeholder="you@bagend.me" required aria-label="Email address">
    <button type="submit">Subscribe</button>
  </form>
</div>
<script>
(function () {
  var w = document.getElementById("leap-side-subscribe");
  // Not on pages that already carry the full subscribe band (the home page),
  // and stay closed for the session once dismissed.
  if (document.querySelector(".leap-subscribe-band") ||
      sessionStorage.getItem("leap-subscribe-closed") === "1") {
    w.remove();
    return;
  }
  document.body.classList.add("has-side-subscribe");
  document.getElementById("leap-side-close").addEventListener("click", function () {
    w.remove();
    document.body.classList.remove("has-side-subscribe");
    sessionStorage.setItem("leap-subscribe-closed", "1");
  });
})();
</script>
