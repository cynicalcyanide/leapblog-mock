# Applies to every article under posts/

citation: true

format:
  html:
    # Comments: Cusdis (open source, email/anonymous commenting, moderated).
    # The embed lives in partials/comments.html; giscus was removed because it
    # requires commenters to have a GitHub account. HTML-scoped so the raw
    # HTML never reaches the Typst PDF render.
    include-after-body:
      - ../../partials/comments.html
    format-links: false
    other-links:
      - text: Download PDF
        icon: file-pdf
        href: index.pdf
  typst:
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm

