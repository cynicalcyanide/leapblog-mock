# Applies to every article under posts/

citation: true
number-sections: true

format:
  html:
    # Comments (Cusdis) + share bar / select-to-quote. HTML-scoped so the
    # raw HTML never reaches the PDF render.
    include-after-body:
      - ../../partials/comments.html
      - ../../partials/share.html
    format-links: false
    other-links:
      - text: Download PDF
        icon: file-pdf
        href: index.pdf
  # Old-school LaTeX paper look for the downloadable PDFs
  pdf:
    documentclass: article
    papersize: a4
    fontsize: 11pt
    geometry:
      - margin=1.1in
    colorlinks: true
    links-as-notes: true
