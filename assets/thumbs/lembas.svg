<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <filter id="w1" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="90"/>
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="w2" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.011" numOctaves="4" seed="50" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="120"/>
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="37"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.05 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="#f8f4e6"/>
  <g filter="url(#w1)">
    <ellipse cx="300" cy="220" rx="330" ry="190" fill="#8a6d3b" opacity="0.55"/>
    <ellipse cx="560" cy="140" rx="240" ry="150" fill="#c9a227" opacity="0.45"/>
  </g>
  <g filter="url(#w2)">
    <ellipse cx="480" cy="330" rx="300" ry="140" fill="#5c7a4e" opacity="0.4"/>
    <ellipse cx="180" cy="120" rx="180" ry="120" fill="#c9a227" opacity="0.35"/>
    <ellipse cx="650" cy="260" rx="160" ry="130" fill="#8a6d3b" opacity="0.3"/>
  </g>
  <rect width="800" height="450" filter="url(#grain)" fill="none"/>
</svg>
